name: NMHDA RTX 4060 Ti (10DE-22BD) build

on:
  push:
    branches:
      - hackintosh/nmhda-22bd-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record build environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m
      - name: Download pinned official NMHDA source and SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/nullmoth/nvidia-macos-driver.git upstream
          git -C upstream checkout -q 4e49db269fcf701a94e141adf9cb0a550eab1243
          git clone -q https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          git -C MacKernelSDK checkout -q 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          curl --fail --location --retry 3 -o Lilu-DEBUG.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
          unzip -q Lilu-DEBUG.zip -d LiluExtract
          find LiluExtract -name Lilu.kext -type d -print
          find MacKernelSDK/Library -maxdepth 2 -type f -print
      - name: Add read-only probe diagnostics and run upstream tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-nmhda-diagnostics.py upstream/kexts/NMHDA/nmhda.cpp
          # Extend the upstream userspace fixture with the hardware PCI access
          # used only by our read-only instrumentation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/tools/test_nmhda_native_id.py')
          s = p.read_text()
          needle = 'struct IOPCIDevice : IOService {};'
          replacement = ('struct IOPCIDevice : IOService {'
                         ' uint16_t extendedConfigRead16(uint64_t off) {'
                         ' if (off == 0) return 0x10DE;'
                         ' if (off == 2) return 0x22BD;'
                         ' return 0;'
                         ' } };')
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, replacement, 1))
          PY
          python3 upstream/tools/test_nmhda_native_id.py
      - name: Compile x86_64 NMHDA kernel extension
        shell: bash
        run: |
          set -euo pipefail
          LILU="$(find "$PWD/LiluExtract" -name Lilu.kext -type d | head -n 1)"
          test -n "$LILU"
          bash upstream/kexts/NMHDA/build.sh "$LILU" "$PWD/MacKernelSDK" "$PWD/build"
      - name: Verify kernel extension
        shell: bash
        run: |
          set -euo pipefail
          test -f build/NMHDA.kext/Contents/MacOS/NMHDA
          test -f build/NMHDA.kext/Contents/Info.plist
          file build/NMHDA.kext/Contents/MacOS/NMHDA
          xcrun lipo -archs build/NMHDA.kext/Contents/MacOS/NMHDA | grep -q x86_64
          plutil -lint build/NMHDA.kext/Contents/Info.plist
          codesign --force --sign - --deep build/NMHDA.kext
          codesign --verify --strict --verbose=2 build/NMHDA.kext
          cat > build/BUILD-INFO.txt <<'EOF'
          EXPERIMENTAL: NMHDA for RTX 4060 Ti HD Audio controller 10DE:22BD
          Upstream: nullmoth/nvidia-macos-driver
          Source: 4e49db269fcf701a94e141adf9cb0a550eab1243
          Lilu SDK: 1.7.2 DEBUG
          MacKernelSDK: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          Instrumentation: logging only (no forced probe, no PCI ID spoof)
          Hardware-tested: NO
          Replace the existing NMHDA.kext; do not load both.
          Only deploy to a recovery-capable test EFI, not the known-good EFI.
          EOF
          ditto -c -k --sequesterRsrc --keepParent build/NMHDA.kext build/NMHDA.kext.zip
          unzip -t build/NMHDA.kext.zip >/dev/null
          shasum -a 256 build/NMHDA.kext/Contents/MacOS/NMHDA > build/NMHDA-SHA256.txt
      - name: Upload ad-hoc-signed diagnostic test kext
        uses: actions/upload-artifact@v4
        with:
          name: NMHDA-10DE-22BD-diagnostic
          path: |
            build/NMHDA.kext.zip
            build/BUILD-INFO.txt
            build/NMHDA-SHA256.txt
          retention-days: 7

      - name: Build HDAU renaming experimental variant
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-nmhda-hdau.py upstream/kexts/NMHDA/nmhda.cpp
          python3 scripts/patch-nmhda-table-check.py upstream/kexts/NMHDA/nmhda.cpp
          LILU="$(find "$PWD/LiluExtract" -name Lilu.kext -type d | head -n 1)"
          test -n "$LILU"
          bash upstream/kexts/NMHDA/build.sh "$LILU" "$PWD/MacKernelSDK" "$PWD/build-hdau"
          test -f build-hdau/NMHDA.kext/Contents/MacOS/NMHDA
          file build-hdau/NMHDA.kext/Contents/MacOS/NMHDA
          xcrun lipo -archs build-hdau/NMHDA.kext/Contents/MacOS/NMHDA | grep -q x86_64
          plutil -lint build-hdau/NMHDA.kext/Contents/Info.plist
          codesign --force --sign - --deep build-hdau/NMHDA.kext
          codesign --verify --strict --verbose=2 build-hdau/NMHDA.kext
          cat > build-hdau/BUILD-INFO.txt <<'EOF'
          EXPERIMENTAL: NMHDA for NVIDIA RTX 4060 Ti controller 10DE:22BD
          Variant: HDAU name/compatible repair, PCI config and bounded controller-table diagnostics
          Based on: official nullmoth NMHDA at 4e49db269fcf701a94e141adf9cb0a550eab1243
          Lilu implementation: WIOKit::renameDevice(provider, "HDAU") before original AppleHDAController probe
          Does not force probe success or change the card's PCI device ID.
          Hardware-tested: NO. Kernel crash or startup failure are possible.
          CAUTION: Only test on a recoverable EFI; retain known-good USB EFI.
          Deploy exactly one NMHDA.kext, never two with the same bundle identifier.
          EOF
          ditto -c -k --sequesterRsrc --keepParent build-hdau/NMHDA.kext build-hdau/NMHDA.kext.zip
          unzip -t build-hdau/NMHDA.kext.zip >/dev/null
          shasum -a 256 build-hdau/NMHDA.kext/Contents/MacOS/NMHDA > build-hdau/NMHDA-SHA256.txt
      - name: Upload HDAU naming experiment
        uses: actions/upload-artifact@v4
        with:
          name: NMHDA-10DE-22BD-HDAU-rename
          path: |
            build-hdau/NMHDA.kext.zip
            build-hdau/BUILD-INFO.txt
            build-hdau/NMHDA-SHA256.txt
          retention-days: 7

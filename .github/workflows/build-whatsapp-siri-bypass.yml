name: Build WhatsApp Siri Bypass

on:
  workflow_dispatch:
  push:
    paths:
      - "src/tweaks/whatsapp/WhatsAppDisableSiriEntitlement.m"
      - "src/utils.h"
      - ".github/workflows/build-whatsapp-siri-bypass.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build WhatsApp Siri bypass
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang             -target arm64-apple-ios16.0             -isysroot "$SDKROOT"             -dynamiclib             -fobjc-arc             -fblocks             -Isrc             -framework Foundation             -framework UIKit             -Wl,-install_name,@rpath/WhatsAppDisableSiriEntitlement.dylib             src/tweaks/whatsapp/WhatsAppDisableSiriEntitlement.m             -o WhatsAppDisableSiriEntitlement.dylib

      - name: Ad-hoc sign dylib
        run: codesign -f -s - WhatsAppDisableSiriEntitlement.dylib

      - name: Verify output
        run: |
          file WhatsAppDisableSiriEntitlement.dylib
          ls -lh WhatsAppDisableSiriEntitlement.dylib
          nm -gU WhatsAppDisableSiriEntitlement.dylib | grep " _init$" || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppDisableSiriEntitlement
          path: WhatsAppDisableSiriEntitlement.dylib
          if-no-files-found: error

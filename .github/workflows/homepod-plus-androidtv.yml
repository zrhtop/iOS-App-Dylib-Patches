name: Build HomePod Plus Android TV APK

on:
  push:
    branches:
      - homepod-plus-androidtv
    paths:
      - 'homepod-tv/**'
      - '.github/workflows/homepod-plus-androidtv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TV adaptation
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for TV image generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Android SDK and TV resources
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"; fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python -m pip install --disable-pip-version-check Pillow
      - name: Clone pinned HomePod Plus v1.5
        run: |
          git clone --depth 1 --branch v1.5 https://github.com/M-Pennn/HomePod-Plus.git upstream
          test "$(git -C upstream rev-parse HEAD)" = c7505d43673132741bca74dafc4f25a3b441e21b
      - name: Apply Android TV modifications
        run: |
          python3 -m py_compile homepod-tv/patch_tv.py
          python3 homepod-tv/patch_tv.py --project upstream
      - name: Build Android TV debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK structure and signature
        run: |
          set -euo pipefail
          APK=upstream/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/tv-badging.txt"
          grep -E "^(package:|application-label:|launchable-activity:|leanback-launchable-activity:)" "$RUNNER_TEMP/tv-badging.txt"
          grep -F "package: name='com.homepodplus.tv.remote'" "$RUNNER_TEMP/tv-badging.txt"
          grep -F "application-label:'HomePod TV Mouse'" "$RUNNER_TEMP/tv-badging.txt"
          grep -F "launchable-activity: name='com.homepodplus.app.TvMainActivity'" "$RUNNER_TEMP/tv-badging.txt"
          grep -F "leanback-launchable-activity: name='com.homepodplus.app.TvMainActivity'" "$RUNNER_TEMP/tv-badging.txt"
          if grep -E "(launchable-activity: name='com.homepodplus.app.MainActivity')" "$RUNNER_TEMP/tv-badging.txt"; then
            echo "ERROR: original phone activity is still a launcher" >&2
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
              classes = b''.join(apk.read(name) for name in apk.namelist()
                                 if name.startswith('classes') and name.endswith('.dex'))
              for symbol in (b'TvRemoteMouse', b'TvMainActivity'):
                  assert symbol in classes, f'Missing TV cursor code: {symbol!r}'
              assert 'res/drawable-nodpi/tv_mouse_icon.png' in apk.namelist(), 'Missing unique TV icon'
              print('Verified TV cursor classes and distinct TV icon inside compiled APK')
          PY
          sha256sum "$APK"
      - name: Upload installable TV APK
        uses: actions/upload-artifact@v4
        with:
          name: HomePodPlus-TV-v1.5.0-tv.3-Mouse-Verified-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build AltStore PR1835 LiveContainer - manual pairing import

on:
  push:
    branches:
      - build/altstore-pr1835-lc-pairfile-20261017
    paths:
      - '.github/workflows/build-altstore-pr1835-lc-pairfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build PR1835 on Xcode 27
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout AltStore PR #1835 (pinned)
        uses: actions/checkout@v6
        with:
          repository: altstoreio/AltStore
          ref: refs/pull/1835/head
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream revision and Xcode version
        shell: bash
        run: |
          set -euo pipefail
          expected='22f766d2edb47626a082a1f775649bcf3fc43aff'
          actual="$(git rev-parse HEAD)"
          echo "Upstream commit: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PR updated since this package was created. Review changes before rebuilding."
            exit 1
          fi
          xcodebuild -version
          git submodule status

      - name: Build iOS arm64 libcurl (upstream archive is i386/armv7 only)
        shell: bash
        run: |
          set -euo pipefail
          echo "Original archive architectures:"
          xcrun lipo -info Dependencies/libcurl/libcurl.a

          # Use already-vendored OpenSSL from PR1835's AltSign submodule.
          ossl="Dependencies/AltSign/Dependencies/OpenSSL/Frameworks/OpenSSL.xcframework/ios-arm64/OpenSSL.framework"
          test -f "$ossl/OpenSSL"
          test -f "$ossl/Headers/ssl.h"
          file "$ossl/OpenSSL"
          xcrun lipo -info "$ossl/OpenSSL" || true
          prefix="$RUNNER_TEMP/openssl-ios"
          mkdir -p "$prefix/lib" "$prefix/include/openssl"
          cp -R "$ossl/Headers/." "$prefix/include/openssl/"
          cp "$ossl/OpenSSL" "$prefix/lib/libssl.a"
          cp "$ossl/OpenSSL" "$prefix/lib/libcrypto.a"

          # Compile libcurl for the device arm64 ABI (not macOS arm64).
          curl -fL --retry 3 --connect-timeout 20 \
            "https://curl.se/download/curl-8.22.0.tar.xz" \
            -o "$RUNNER_TEMP/curl-8.22.0.tar.xz"
          tar -xf "$RUNNER_TEMP/curl-8.22.0.tar.xz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/curl-8.22.0" -B "$RUNNER_TEMP/curl-ios-build" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$prefix" \
            -DOPENSSL_INCLUDE_DIR="$prefix/include" \
            -DOPENSSL_SSL_LIBRARY="$prefix/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$prefix/lib/libcrypto.a" \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DUSE_LIBIDN2=OFF \
            -DUSE_NGHTTP2=OFF \
            -DCURL_ZLIB=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON
          cmake --build "$RUNNER_TEMP/curl-ios-build" --target libcurl_static --parallel 6
          built="$(find "$RUNNER_TEMP/curl-ios-build" -name libcurl.a -type f | head -1)"
          test -n "$built" && test -s "$built"
          cp "$built" Dependencies/libcurl/libcurl.a
          echo "Rebuilt library architectures:"
          xcrun lipo -info Dependencies/libcurl/libcurl.a
          xcrun lipo -archs Dependencies/libcurl/libcurl.a
      - name: Preserve manually entered UDID when guest bundle has none
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AltStore/AppDelegate.swift")
          src = p.read_text()
          old = "UserDefaults.shared.deviceID = Bundle.main.object(forInfoDictionaryKey: Bundle.Info.deviceID) as? String"
          assert src.count(old) == 1, "AppDelegate UDID assignment changed upstream; review before patching"
          new = """if let bundledDeviceID = Bundle.main.object(forInfoDictionaryKey: Bundle.Info.deviceID) as? String, !bundledDeviceID.isEmpty
                  {
                      UserDefaults.shared.deviceID = bundledDeviceID
                  }"""
          p.write_text(src.replace(old, new))
          print("Installed guest-safe UDID persistence patch")
          PY

      - name: Enable manual pairing-file import for LiveContainer guests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AltStore/Settings/RemoteAltServerSetupView.swift')
          src = path.read_text()
          replacements = [
              ("import SwiftUI\n", "import SwiftUI\nimport UniformTypeIdentifiers\n"),
              ("    @State\n    private var isShowingError = false", "    @State\n    private var isImportingPairingFile = false\n\n    @State\n    private var isShowingError = false"),
              ("            .sensoryFeedback(.success, trigger: pairingState)", "            .fileImporter(isPresented: $isImportingPairingFile,\n                          allowedContentTypes: [.data],\n                          allowsMultipleSelection: false) { result in\n                do\n                {\n                    guard let fileURL = try result.get().first else { throw CocoaError(.fileNoSuchFile) }\n                    let canAccess = fileURL.startAccessingSecurityScopedResource()\n                    defer { if canAccess { fileURL.stopAccessingSecurityScopedResource() } }\n\n                    let data = try Data(contentsOf: fileURL)\n                    _ = try FetchPairingFileOperation.PairingFile(data: data)\n\n                    // Check UDID when this is a lockdown-style pairing record.\n                    if let plist = try PropertyListSerialization.propertyList(from: data, format: nil) as? [String: Any],\n                       let pairedUDID = plist[\"UDID\"] as? String,\n                       let currentUDID = UserDefaults.shared.deviceID,\n                       pairedUDID.caseInsensitiveCompare(currentUDID) != .orderedSame\n                    {\n                        throw NSError(domain: \"AltStoreManualPairing\", code: 1, userInfo: [\n                            NSLocalizedDescriptionKey: \"This pairing file belongs to another device.\"\n                        ])\n                    }\n\n                    Keychain.shared.devicePairingFile = data\n                    guard Keychain.shared.devicePairingFile == data else\n                    {\n                        throw NSError(domain: \"AltStoreManualPairing\", code: 2, userInfo: [\n                            NSLocalizedDescriptionKey: \"Unable to save pairing file in Keychain.\"\n                        ])\n                    }\n\n                    pairingState = .paired\n                    advance()\n                }\n                catch\n                {\n                    pairingState = .idle\n                    errorMessage = error.localizedDescription\n                    isShowingError = true\n                }\n            }\n            .sensoryFeedback(.success, trigger: pairingState)"),
              ("            PairingButton(state: pairingState, idleTitle: \"Start Pairing\", waitingTitle: \"Waiting to Pair…\") {\n                pairingAttempt += 1\n            }", "            PairingButton(state: pairingState, idleTitle: \"Start Pairing\", waitingTitle: \"Waiting to Pair…\") {\n                pairingAttempt += 1\n            }\n            SwiftUI.Button(\"Import Existing Pairing File\") {\n                isImportingPairingFile = true\n            }\n            .buttonStyle(.bordered)\n            .foregroundStyle(Color(uiColor: .label))"),
              ("            PairingButton(state: pairingState, idleTitle: \"Pair with AltServer\", waitingTitle: \"Connecting to AltServer…\") {\n                pairingAttempt += 1\n            }", "            PairingButton(state: pairingState, idleTitle: \"Pair with AltServer\", waitingTitle: \"Connecting to AltServer…\") {\n                pairingAttempt += 1\n            }\n            SwiftUI.Button(\"Import Existing Pairing File\") {\n                isImportingPairingFile = true\n            }\n            .buttonStyle(.bordered)\n            .foregroundStyle(Color(uiColor: .label))"),
          ]
          for before, after in replacements:
              assert src.count(before) == 1, f'Unexpected upstream code around {before[:55]!r}'
              src = src.replace(before, after, 1)
          path.write_text(src)
          print('Manual pairing importer installed; validated files stay on device')
          PY

      - name: Compile unsigned iPhoneOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AltStore.xcworkspace \
            -scheme AltStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/altstore-derived" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            build 2>&1 | tee "$RUNNER_TEMP/altstore-xcodebuild.log"

      - name: Package standard and LiveContainer-test unsigned IPAs
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/altstore-derived/Build/Products/Release-iphoneos/AltStore.app"
          if [ ! -d "$app" ]; then
            echo "::error::AltStore.app was not produced."
            exit 1
          fi
          test -f "$app/Info.plist"
          execname="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          echo "Bundle ID: $bid"
          echo "Executable: $execname"
          test -f "$app/$execname"
          xcrun lipo -info "$app/$execname"
          file "$app/$execname"
          # Source app is unsigned. Never embed credentials, pairing material, or certificates in the IPA.
          mkdir -p "$RUNNER_TEMP/ipa-standard/Payload" "$RUNNER_TEMP/ipa-livecontainer/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa-standard/Payload/AltStore.app"
          ditto "$app" "$RUNNER_TEMP/ipa-livecontainer/Payload/AltStore.app"
          # LiveContainer cannot register app extensions. Remove them only from the experimental guest build.
          guest="$RUNNER_TEMP/ipa-livecontainer/Payload/AltStore.app"
          rm -rf "$guest/PlugIns" "$guest/Watch" "$guest/WatchKitSupport"
          # A guest in LiveContainer cannot assume AltStore's app-group entitlement or the
          # sample device UDID embedded in the upstream Xcode project's Info.plist.
          # Without ALTDeviceID, PR1835 prompts for the real UDID and persists it in UserDefaults.
          /usr/libexec/PlistBuddy -c 'Delete :ALTAppGroups' "$guest/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :ALTDeviceID' "$guest/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :ALTServerID' "$guest/Info.plist"
          ! /usr/libexec/PlistBuddy -c 'Print :ALTDeviceID' "$guest/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ALTAppGroups' "$guest/Info.plist" >/dev/null 2>&1
          # No entitlement bypass is claimed. This only removes unsupported guest targets.
          test -f "$guest/$execname"
          (cd "$RUNNER_TEMP/ipa-standard" && /usr/bin/zip -q -r "$GITHUB_WORKSPACE/AltStore-Classic-2.3-PR1835-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP/ipa-livecontainer" && /usr/bin/zip -q -r "$GITHUB_WORKSPACE/AltStore-Classic-2.3-PR1835-LiveContainer-ImportPair-unsigned.ipa" Payload)
          for ipa in "$GITHUB_WORKSPACE"/*.ipa; do
            echo "Checking $ipa"
            unzip -tq "$ipa" | tail -1
            ls -lh "$ipa"
          done

      - name: Upload PR1835 standard IPA
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-Classic-2.3-PR1835-unsigned
          path: AltStore-Classic-2.3-PR1835-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload PR1835 LiveContainer test IPA
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-Classic-2.3-PR1835-LiveContainer-ImportPair-unsigned
          path: AltStore-Classic-2.3-PR1835-LiveContainer-ImportPair-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-PR1835-build-log
          path: ${{ runner.temp }}/altstore-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
